name: Format Prompt Firewall

on:
  push:
    branches:
      - feat/untrusted-tool-content-firewall

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/untrusted-tool-content-firewall
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: >-
          npx prettier --write
          src/security/untrusted-content.ts
          src/audit/audit-log.ts
          src/mcp/server.ts
          src/http/server.ts
          tests/unit/untrusted-content.test.ts
          tests/unit/tool-content-boundary.test.ts
          SECURITY.md
      - name: Commit normalized formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/security/untrusted-content.ts src/audit/audit-log.ts src/mcp/server.ts src/http/server.ts tests/unit/untrusted-content.test.ts tests/unit/tool-content-boundary.test.ts SECURITY.md
          git commit -m "style: normalize untrusted-content firewall"
          git push origin HEAD:feat/untrusted-tool-content-firewall
