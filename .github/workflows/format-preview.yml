name: Format Preview

on:
  push:
    branches:
      - feat/rai110-security-contract-evals

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print exact Prettier diff
        run: |
          npx prettier src/security/untrusted-content.ts tests/fixtures/prompt-injection-corpus.json --write
          git diff -- src/security/untrusted-content.ts tests/fixtures/prompt-injection-corpus.json
