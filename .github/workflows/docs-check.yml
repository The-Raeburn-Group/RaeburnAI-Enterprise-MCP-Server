name: Documentation Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify docs
        run: |
          test -f README.md
          test -f docs/ECOSYSTEM.md
          test -f docs/software-supply-chain.md
