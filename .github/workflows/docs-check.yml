name: Documentation Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify docs
        run: |
          test -f README.md
          test -f docs/ECOSYSTEM.md
          test -f docs/software-supply-chain.md
