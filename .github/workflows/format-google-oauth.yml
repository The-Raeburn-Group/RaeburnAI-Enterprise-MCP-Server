name: Format Google OAuth branch

on:
  push:
    branches: [feat/google-oauth-scope-policy]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/google-oauth-scope-policy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/PRODUCTION_CHECKLIST.md src/security/google-oauth.ts
      - name: Commit formatting
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/PRODUCTION_CHECKLIST.md src/security/google-oauth.ts
            git commit -m "style(google): normalize OAuth policy files"
            git push
          fi
