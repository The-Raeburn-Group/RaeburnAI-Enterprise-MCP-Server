name: Format PR11

on:
  push:
    branches:
      - feat/github-least-privilege-policy

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/github-least-privilege-policy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/config.ts src/connectors/github.ts tests/unit/github-policy.test.ts
      - name: Commit normalized formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/config.ts src/connectors/github.ts tests/unit/github-policy.test.ts
          git commit -m "style: normalize GitHub least-privilege policy"
          git push origin HEAD:feat/github-least-privilege-policy
