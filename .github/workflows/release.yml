name: Release trust package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install deterministic dependencies
        run: npm ci
      - name: Validate software supply-chain policy
        run: npm run validate:supply-chain
      - name: Enforce zero High/Critical dependency gate
        run: npm audit --audit-level=high
      - name: Run quality checks
        run: npm run check
      - name: Build package
        run: npm run build
      - name: Audit production dependencies
        run: npm run audit:deps
      - name: Build deterministic container image
        run: docker build -t raeburnai-enterprise-mcp:${{ github.sha }} .
      - name: Scan container for High/Critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: raeburnai-enterprise-mcp:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
      - name: Create release artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          artifact="${{ github.event.repository.name }}-${{ github.ref_name }}.tar.gz"
          tar --exclude='.git' --exclude='node_modules' --exclude='**/node_modules' -czf "$artifact" .
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            "${{ steps.package.outputs.artifact }}" \
            package-lock.json \
            sbom.spdx.json \
            sbom.cdx.json \
            > SHA256SUMS
      - name: Install Cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159
      - name: Sign release trust artifacts
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle release.tar.gz.sigstore "${{ steps.package.outputs.artifact }}"
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore SHA256SUMS
          cosign sign-blob --yes --bundle sbom.spdx.json.sigstore sbom.spdx.json
          cosign sign-blob --yes --bundle sbom.cdx.json.sigstore sbom.cdx.json
      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: '${{ steps.package.outputs.artifact }}'
      - name: Attest SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: '${{ steps.package.outputs.artifact }}'
          sbom-path: sbom.spdx.json
      - name: Attest CycloneDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: '${{ steps.package.outputs.artifact }}'
          sbom-path: sbom.cdx.json
      - name: Create verification guide
        shell: bash
        run: |
          cat > TRUST-PACKAGE.txt <<'EOF'
          RaeburnAI Enterprise MCP release trust package

          Release publication is blocked by quality checks, High/Critical dependency findings,
          High/Critical container findings, build failure, or supply-chain policy drift.

          Verify checksums:
            sha256sum -c SHA256SUMS

          Verify GitHub provenance:
            gh attestation verify <artifact> --repo ${{ github.repository }}

          Verify a Sigstore bundle:
            cosign verify-blob --bundle <file>.sigstore <file>
          EOF
      - name: Publish release and trust package
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2
        with:
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.artifact }}
            SHA256SUMS
            sbom.spdx.json
            sbom.cdx.json
            release.tar.gz.sigstore
            SHA256SUMS.sigstore
            sbom.spdx.json.sigstore
            sbom.cdx.json.sigstore
            TRUST-PACKAGE.txt
