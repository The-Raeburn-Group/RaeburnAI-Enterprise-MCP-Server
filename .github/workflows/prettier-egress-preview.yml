name: Prettier Egress Preview

on:
  push:
    branches: [feat/tool-egress-policy]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print expected egress formatting
        run: |
          echo '=== tool-egress.ts ==='
          npx prettier src/security/tool-egress.ts
          echo '=== http-tenant.test.ts ==='
          npx prettier tests/unit/http-tenant.test.ts
          echo '=== tool-egress.test.ts ==='
          npx prettier tests/unit/tool-egress.test.ts
