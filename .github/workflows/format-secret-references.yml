name: Normalize secret-reference formatting

on:
  push:
    branches: [feat/external-secret-references]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/external-secret-references
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Format secret-reference files
        run: npx prettier --write src/security/secrets.ts tests/unit/secrets.test.ts
      - name: Commit canonical formatting
        run: |
          if git diff --quiet -- src/security/secrets.ts tests/unit/secrets.test.ts; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/security/secrets.ts tests/unit/secrets.test.ts
          git commit -m 'style(secrets): apply canonical formatting'
          git push origin HEAD:feat/external-secret-references
